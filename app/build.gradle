apply plugin: 'com.android.application'

android {
    namespace "com.mojang.minecraftpe.platforms"
    compileSdk 34
    ndkVersion "21.4.7075529"

    defaultConfig {
        applicationId "com.mojang.minecraftpe.platforms"
        minSdk 19
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
        debug {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
